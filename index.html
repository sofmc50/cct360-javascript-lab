<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT360 JavaScript Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>CCT360 JavaScript Lab</h1>
        <p id="message">Try the buttons to change this page.</p>

        <section class="activity">
            <h2>Page Interactions</h2>

            <button onclick="changeMessage()">Change the Message</button>
            <button onclick="changeColour()">Change the Colour</button>
            <button onclick="askQuestion()">Answer a Question</button>

            <p id="answer">Your answer will appear here.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
